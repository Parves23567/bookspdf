<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#fdf6b2"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#bg)"/>

  <!-- Gold outer border -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>
  <rect x="34" y="34" width="444" height="444" rx="78" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.4" stroke-dasharray="10 5"/>

  <!-- Light rays from centre -->
  <g opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="215" x2="256" y2="174"/>
    <line x1="218" y1="226" x2="188" y2="196"/>
    <line x1="294" y1="226" x2="324" y2="196"/>
    <line x1="175" y1="250" x2="140" y2="236"/>
    <line x1="337" y1="250" x2="372" y2="236"/>
  </g>

  <!-- Crescent moon -->
  <circle cx="230" cy="122" r="68" fill="url(#gold)"/>
  <circle cx="258" cy="102" r="56" fill="#059669"/>

  <!-- 8-pointed star -->
  <g transform="translate(324,114)">
    <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="url(#gold)"/>
    <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="url(#gold)" transform="rotate(45) scale(0.68)"/>
    <circle r="7" fill="#059669"/>
  </g>

  <!-- Book covers -->
  <polygon points="255,242 178,220 100,234 70,346 142,332 255,352" fill="#064e3b" stroke="url(#gold)" stroke-width="3"/>
  <polygon points="257,242 334,220 412,234 442,346 370,332 257,352" fill="#064e3b" stroke="url(#gold)" stroke-width="3"/>

  <!-- Cream pages -->
  <polygon points="252,232 182,212 108,226 80,336 150,322 252,342" fill="url(#page)" stroke="url(#gold)" stroke-width="2.5"/>
  <polygon points="260,232 330,212 404,226 432,336 362,322 260,342" fill="url(#page)" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Left page Arabic-style lines -->
  <line x1="114" y1="258" x2="232" y2="250" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="114" y1="278" x2="232" y2="270" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="114" y1="298" x2="232" y2="290" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="318" x2="224" y2="310" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

  <!-- Right page Arabic-style lines -->
  <line x1="280" y1="250" x2="398" y2="258" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="270" x2="398" y2="278" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="290" x2="398" y2="298" stroke="#047857" stroke-width="5" stroke-linecap="round"/>
  <line x1="288" y1="310" x2="384" y2="318" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

  <!-- Gold bookmark ribbon -->
  <polygon points="251,222 261,222 261,386 256,374 251,386" fill="url(#gold)" stroke="#b45309" stroke-width="1"/>

  <!-- Rehal left leg -->
  <polygon points="155,398 220,330 244,354 185,422" fill="#78350f" stroke="url(#gold)" stroke-width="2"/>
  <!-- Rehal right leg -->
  <polygon points="357,398 292,330 268,354 327,422" fill="#78350f" stroke="url(#gold)" stroke-width="2"/>
  <!-- Rehal centre joint -->
  <polygon points="226,356 256,336 286,356 275,374 256,358 237,374" fill="url(#gold)"/>
</svg>
