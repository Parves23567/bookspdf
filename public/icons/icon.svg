<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2f26" />
      <stop offset="50%" stop-color="#0f3a2f" />
      <stop offset="100%" stop-color="#061c16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb9" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faf6ec" />
      <stop offset="100%" stop-color="#f0e9d6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Inner Ornamental Border -->
  <rect x="36" y="36" width="440" height="440" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 6"/>

  <!-- Central Star / Embellishment -->
  <g transform="translate(256, 120)">
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)"/>
    <path d="M 0 -28 L 6 -12 L 22 -6 L 10 6 L 14 24 L 0 14 L -14 24 L -10 6 L -22 -6 L -6 -12 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Open Book Group -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Left Page -->
    <path d="M 250 180 C 190 170 120 185 80 195 L 80 375 C 120 365 190 350 250 360 Z" fill="url(#pageGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Right Page -->
    <path d="M 262 180 C 322 170 392 185 432 195 L 432 375 C 392 365 322 350 262 360 Z" fill="url(#pageGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Left Page Lines -->
    <line x1="110" y1="225" x2="225" y2="215" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="110" y1="255" x2="225" y2="245" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="110" y1="285" x2="225" y2="275" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="110" y1="315" x2="200" y2="307" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- Right Page Lines -->
    <line x1="287" y1="215" x2="402" y2="225" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="287" y1="245" x2="402" y2="255" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="287" y1="275" x2="402" y2="285" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <line x1="287" y1="307" x2="377" y2="315" stroke="#8b7355" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- Spine / Center Bookmark Ribbon -->
    <path d="M 252 170 L 260 170 L 260 405 L 256 395 L 252 405 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Bengali Calligraphic Ribbon Text Banner: 'বই' -->
  <text x="256" y="445" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="32" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">আমার বাংলা লাইব্রেরি</text>
</svg>
