<!DOCTYPE html>
<html lang="bn" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>আমার বাংলা লাইব্রেরি | ডিজিটাল PDF রিডার ও বই সংকলন</title>
    
    <!-- Meta tags for PWA and Mobile -->
    <meta name="description" content="একটি আধুনিক, দ্রুতগতির এবং সম্পূর্ণ Mobile-Friendly বাংলা ডিজিটাল লাইব্রেরি ও PDF Reading App।" />
    <meta name="theme-color" content="#0f3a2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="বাংলা লাইব্রেরি" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Bengali Fonts (Hind Siliguri & Noto Serif Bengali) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full bg-library-bg text-library-text font-hind antialiased selection:bg-library-accent selection:text-library-primaryDark">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully with scope:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
